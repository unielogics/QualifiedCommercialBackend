 initials<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1\"><div style=\"min-height:16px;border-bottom:1px solid #0B1D3A\"><\u002Fdiv><div style=\"font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391;margin-top:3px\">Dealer initials<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1\"><div style=\"min-height:16px;border-bottom:1px solid #0B1D3A\"><\u002Fdiv><div style=\"font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391;margin-top:3px\">Sponsor initials<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">21<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Electronic Records and Signatures<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>21.1 &nbsp;Consent<\u002Fh3>\n  <p>The Parties consent to conduct this transaction electronically and to receive, review, sign, retain, and download electronic records.<\u002Fp>\n\n  <h3>21.2 &nbsp;Independent Execution<\u002Fh3>\n  <p>Each signer must independently adopt their electronic signature with the intent to sign. No employee or representative may apply another person’s signature.<\u002Fp>\n\n  <h3>21.3 &nbsp;Document Integrity<\u002Fh3>\n  <p>The electronic-signature process may record visible signature; typed name; signer title; timestamp; IP address; user agent; document hash; signature hash; authentication events; and completion certificate. These records are intended to support attribution, integrity, authentication, retention, and evidentiary reliability.<\u002Fp>\n\n  <h3>21.4 &nbsp;Exact Document<\u002Fh3>\n  <p>The signed record must correspond to the exact document presented to the signer. A material post-signature change requires a new execution or a properly authorized amendment.<\u002Fp>\n\n  <h3>21.5 &nbsp;Retention<\u002Fh3>\n  <p>Each signer must be given a reasonable opportunity to download or retain the signed Agreement.<\u002Fp>\n\n  <h3>21.6 &nbsp;Counterparts<\u002Fh3>\n  <p>This Agreement may be signed in counterparts, each of which is treated as an original and all of which together form one instrument.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">22<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">General Provisions<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>22.1 &nbsp;Independent Contractors<\u002Fh3>\n  <p>The Parties are independent contractors. This Agreement does not create a partnership, joint venture, fiduciary relationship, employment relationship, or general agency.<\u002Fp>\n\n  <h3>22.2 &nbsp;No Relationship Manager Authority to Bind<\u002Fh3>\n  <p>The Relationship Manager may not bind the Dealer, Sponsor, Qualified Commercial, or Funding Party unless expressly authorized in writing for a specific act.<\u002Fp>\n\n  <h3>22.3 &nbsp;Assignment<\u002Fh3>\n  <p>The Dealer may not assign this Agreement without written consent. Qualified Commercial or the Sponsor may assign this Agreement to an affiliate; in connection with a merger or sale; to a successor program manager; as collateral to the Funding Party; or with the Funding Facility, provided the assignment does not materially reduce the Dealer’s rights or evade applicable law.<\u002Fp>\n\n  <h3>22.4 &nbsp;Amendments<\u002Fh3>\n  <p>An amendment must be in writing and signed by the Parties affected by it. No oral modification is effective.<\u002Fp>\n\n  <h3>22.5 &nbsp;Notices<\u002Fh3>\n  <p>Formal notices must be delivered to the notice addresses in Schedule 1 by confirmed email; nationally recognized overnight carrier; certified mail; or an approved secure platform generating delivery evidence.<\u002Fp>\n\n  <h3>22.6 &nbsp;Entire Agreement<\u002Fh3>\n  <p>This Agreement, completed schedules, addenda, Activation Certificate, and incorporated documents constitute the entire agreement concerning the integrated program. They do not replace the Funding Documents or Application Documents.<\u002Fp>\n\n  <h3>22.7 &nbsp;Severability and Compliance Savings<\u002Fh3>\n  <p>If a provision is invalid, unlawful, or unenforceable: it will be modified to the minimum extent necessary; the lawful remainder will remain effective; no provision will be interpreted to require unlicensed conduct; no provision will be interpreted to require an unlawful product sale; and no provision will be interpreted to override mandatory funding, privacy, fair-lending, consumer, or service-contract law.<\u002Fp>\n\n  <h3>22.8 &nbsp;Waiver<\u002Fh3>\n  <p>A waiver must be in writing. Failure to enforce a provision once is not a continuing waiver.<\u002Fp>\n\n  <h3>22.9 &nbsp;No Third-Party Beneficiary<\u002Fh3>\n  <p>Except for a Funding Party that signs a joinder or is expressly identified as a beneficiary in the Activation Certificate, no third party has enforcement rights under this Agreement.<\u002Fp>\n\n  <h3>22.10 &nbsp;State-Specific Addenda<\u002Fh3>\n  <p>A state-specific addendum controls over this Agreement to the extent necessary to comply with mandatory law in the Dealer’s jurisdiction.<\u002Fp>\n\n  <h3>22.11 &nbsp;Construction<\u002Fh3>\n  <p>The Agreement will be interpreted as mutually drafted. Headings are for convenience and do not limit meaning.<\u002Fp>\n\n  <div style=\"border-top:2px solid #0B1D3A;margin-top:26px;padding-top:14px\">\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:#0F7A73\">Addendum
