ight:700;font-size:10.5px;color:#0B1D3A}\n<\u002Fstyle>\n<script src=\"cdd8b18a-654b-4675-b042-68695cb1c8e4\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"letter\">\n  <div style=\"border-bottom:2px solid #0B1D3A;padding-bottom:16px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:18px\">\n      <div style=\"display:flex;align-items:center;gap:10px;flex:none\">\n        <svg sc-camel-view-box=\"0 0 512 512\" width=\"27\" height=\"27\" style=\"display:block;flex:none\">\n          <circle cx=\"200\" cy=\"240\" r=\"120\" fill=\"none\" stroke=\"#0B1D3A\" stroke-width=\"52\"><\u002Fcircle>\n          <line x1=\"280\" y1=\"320\" x2=\"350\" y2=\"400\" stroke=\"#0B1D3A\" stroke-width=\"52\" stroke-linecap=\"square\"><\u002Fline>\n          <path d=\"M 460 140 A 130 130 0 1 0 460 370\" fill=\"none\" stroke=\"#0F7A73\" stroke-width=\"52\" stroke-linecap=\"square\"><\u002Fpath>\n        <\u002Fsvg>\n        <div style=\"display:flex;flex-direction:column;gap:3px\">\n          <div style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11px;letter-spacing:0.13em;line-height:1;color:#0B1D3A\">QUALIFIED COMMERCIAL<\u002Fdiv>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Program Manager<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:400;font-size:13px;color:#8FA3BF;flex:none\">×<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;align-items:flex-start;flex:none\">\n        <div style=\"background:#0B1D3A;padding:4px 8px;display:inline-flex\"><img src=\"219ece13-b6dd-41f3-9db9-597806b7cff4\" alt=\"UrChoice\" style=\"height: 58px; width: 101px; display: block\"><\u002Fdiv>\n        <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Sponsor<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-left:auto;text-align:right;flex:none\">\n        <div style=\"font-size:7.5px;letter-spacing:0.11em;text-transform:uppercase;color:#5E7391\">Agreement No.<\u002Fdiv>\n        <div data-field=\"agreement_no\" style=\"min-width:110px;min-height:15px;border-bottom:1px solid #0B1D3A;margin-top:4px\"><\u002Fdiv>\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:7px;letter-spacing:0.11em;color:#0B1D3A;margin-top:7px\">CONFIDENTIAL<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:baseline;gap:11px;margin-top:18px\">\n      <div style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:8px;letter-spacing:0.17em;text-transform:uppercase;color:#0F7A73;flex:none\">Stage Two — Signed at Closing<\u002Fdiv>\n      <div style=\"height:1px;flex:1;background:#B9C6D8\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:23px;line-height:1.12;letter-spacing:-0.015em;margin-top:9px;max-width:32ch;color:#0B1D3A;text-wrap:balance\">Program Activation and Production Agreement<\u002Fdiv>\n\n    <div style=\"border:1px solid #0B1D3A;border-left:3px solid #0F7A73;padding:8px 11px;margin-top:14px;font-size:9px;line-height:1.45;color:#0B1D3A;font-weight:600\">Do not execute until Actual Funding has occurred and Addendum A, Schedule 3, and the Funding Activation Certificate in Schedule 5 have been completed. This Agreement follows the previously executed Production Commitment and Capital Engagement Agreement.<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:15px\">\n      <div>\n        <div style=\"font-size:7.5px;letter-spacing:0.12em;text-transform:uppercase;color:#5E7391\">Activation Date<\u002Fdiv>\n        <div data-field=\"activation_date\" style=\"margin-top:5px;min-height:16px;border-bottom:1px solid #0B1D3A\"><\u002Fdiv>\n        <div style=\"font-size:7px;color:#8FA3BF;margin-top:3px\">Not earlier than Actual Funding<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:7.5px;letter-spacing:0.12em;text-transform:uppercase;color:#5E7391\">Actual Funding Date<\u002Fdiv>\n        <div data-field=\"actual_funding_date\" style=\"margin-top:5px;min-height:16px;border-bottom:1px solid #0B1D3A\"><\u002Fdiv>\n        <div style=\"font-size:7px;color:#8FA3BF;margin-top:3px\">Disbursed and cleared<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:7.5px;letter-spacing:0.12em;text-transform:uppercase;color:#5E7391\">Commitment Agreement dated<\u002Fdiv>\n        <div data-field=\"commitment_agreement_date\" style=\"margin-top:5px;min-height:16px;border-bottom:1px solid #0B1D3A\"><\u002Fdiv>\n        <div style=\"font-size:7px;color:#8FA3BF;margin-top:3px\">Stage one execution date<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:7.5px;letter-spacing:0.12em;text-transform:uppercase;color:#5E7391\">Governing Law<\u002Fdiv>\n        <div style=\"margin-top:5px;min-height:16px;border-bottom:1px solid #B9C6D8;font-family:'Archivo',sans-serif;font-weight:700;font-size:10px;color:#0B1D3A\">State of New Jersey<\u002Fdiv>\n        <div style=\"font-size:7px;color:#8FA3BF;margin-top:3px\">Venue: New Jersey<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin-top:14px\">This Program Activation and Production Agreement, together with all completed schedules, addenda, the Funding Activation Certificate, and amendments incorporated into it, is referred to as the <strong>“Agreement.”<\u002Fstrong><\u002Fp>\n\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;color:#0B1D3A;padding-bottom:5px;border-bottom:1.5px solid #0B1D3A\">Parties<\u002Fh2>\n\n  <p>This Agreement is entered into among:<\u002Fp>\n\n  <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:9px\">\n    <div style=\"border:0.5px solid #B9C6D8;border-left:2.5px solid #0B1D3A;padding:10px 12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:10.5px;color:#0B1D3A\">Qualified Commercial LLC<\u002Fdiv>\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:7.5px;letter-spacing:0.12em;color:#0F7A73;flex:none\">PROGRAM MANAGER<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:4px\">A New Jersey limited liability company, referred to as <strong>“Qualified Commercial”<\u002Fstrong> or the <strong>“Program Manager”<\u002Fstrong>.<\u002Fp>\n      <div style=\"margin-top:7px\">\n        <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Address<\u002Fdiv>\n        <div data-field=\"qc_address\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:0.5px solid #B9C6D8;border-left:2.5px solid #0B1D3A;padding:10px 12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:10.5px;color:#0B1D3A\">Dealership<\u002Fdiv>\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:7.5px;letter-spacing:0.12em;color:#0F7A73;flex:none\">DEALER<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:4px\">Referred to as the <strong>“Dealer”<\u002Fstrong>.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1.8fr 1fr 1fr;gap:9px 12px;margin-top:7px\">\n        <div>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Full legal name<\u002Fdiv>\n          <div data-field=\"dealer_legal_name\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">State of formation<\u002Fdiv>\n          <div data-field=\"dealer_state\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Entity type<\u002Fdiv>\n          <div data-field=\"dealer_entity_type\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Doing business as<\u002Fdiv>\n          <div data-field=\"dealer_dba\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"grid-column:span 2\">\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Address<\u002Fdiv>\n          <div data-field=\"dealer_address\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:0.5px solid #B9C6D8;border-left:2.5px solid #0F7A73;padding:10px 12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:10.5px;color:#0B1D3A\">Warranty Provider, Administrator, or Sales Organization<\u002Fdiv>\n        <div style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:7.5px;letter-spacing:0.12em;color:#0F7A73;flex:none\">SPONSOR<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:4px\">Referred to as the <strong>“Sponsor”<\u002Fstrong>.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1.8fr 1fr 1fr;gap:9px 12px;margin-top:7px\">\n        <div>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Full legal name<\u002Fdiv>\n          <div data-field=\"sponsor_legal_name\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">State of formation<\u002Fdiv>\n          <div data-field=\"sponsor_state\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Entity type<\u002Fdiv>\n          <div data-field=\"sponsor_entity_type\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"grid-column:span 3\">\n          <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Address<\u002Fdiv>\n          <div data-field=\"sponsor_address\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n  <p style=\"margin-top:10px\">Qualified Commercial, the Dealer, and the Sponsor are each a <strong>“Party”<\u002Fstrong> and collectively the <strong>“Parties.”<\u002Fstrong><\u002Fp>\n\n  <p>The bank, private-credit fund, special-purpose funding entity, or other institution that ultimately advances capital to the Dealer is referred to as the <strong>“Funding Party.”<\u002Fstrong> The Funding Party is not a Party to this Agreement unless it signs a written joinder.<\u002Fp>\n\n  <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;color:#0B1D3A;padding-bottom:5px;border-bottom:1.5px solid #0B1D3A\">Recitals<\u002Fh2>\n\n  <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:9px\">\n    <div style=\"display:flex;gap:9px\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;color:#0F7A73;min-width:12px\">A.<\u002Fspan><span style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">The Parties previously executed the Production Commitment and Capital Engagement Agreement, under which the Dealer voluntarily elected to participate in the integrated program and conditionally committed to route Covered Product production if financing funded.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:9px\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;color:#0F7A73;min-width:12px\">B.<\u002Fspan><span style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">Actual Funding has now occurred, and the Funding Party has advanced capital to the Dealer under the Funding Documents.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:9px\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;color:#0F7A73;min-width:12px\">C.<\u002Fspan><span style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">The Parties wish to certify the closing, fix the exact production and remittance thresholds derived from the verified baseline, and convert the Dealer’s conditional commitment into operative obligations.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:9px\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;color:#0F7A73;min-width:12px\">D.<\u002Fspan><span style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">The Sponsor has confirmed that it is authorized and operationally able to administer the Covered Products in the applicable jurisdiction.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:9px\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;color:#0F7A73;min-width:12px\">E.<\u002Fspan><span style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">Qualified Commercial will continue to serve as program manager and will provide the Capital Health Services described in Section 10 for the duration of the Program Term.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:9px\"><span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:9.5px;color:#0F7A73;min-width:12px\">F.<\u002Fspan><span style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">The Parties intend that the Funding Documents continue to control principal, interest, payment, collateral, guaranty, default, and lender remedies, and that this Agreement control the program, production, reporting, and relationship obligations.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin-top:9px\">The Parties therefore agree as follows.<\u002Fp>\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">1<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Definitions<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>1.1 &nbsp;Actual Funding<\u002Fh3>\n  <p><strong>“Actual Funding”<\u002Fstrong> means the irrevocable disbursement and clearance of at least the Minimum Activation Amount:<\u002Fp>\n  <ol>\n    <li>Into an account owned or controlled by the Dealer;<\u002Fli>\n    <li>Directly to an approved creditor, seller, floorplan provider, inventory source, or other approved payee on behalf of the Dealer; or<\u002Fli>\n    <li>Into an approved controlled account for the benefit of the Dealer.<\u002Fli>\n  <\u002Fol>\n  <p style=\"margin-top:6px\">Actual Funding does not include a prequalification; an underwriting indication; a term sheet; a letter of interest; a commitment subject to unsatisfied conditions; an approval that has not funded; an unadvanced credit limit; a failed or reversed transfer; a test deposit; or an oral or written promise of future funding.<\u002Fp>\n\n  <h3>1.2 &nbsp;Activation Certificate<\u002Fh3>\n  <p><strong>“Activation Certificate”<\u002Fstrong> means the closing certificate attached as Schedule 5 identifying the Funding Party, actual amount disbursed, Activation Date, Funding Documents, production commencement date, payment obligation, and other closing information.<\u002Fp>\n\n  <h3>1.3 &nbsp;Activation Date<\u002Fh3>\n  <p><strong>“Activation Date”<\u002Fstrong> means the date stated in a properly completed Activation Certificate, which may not be earlier than the date Actual Funding occurs.<\u002Fp>\n\n  <h3>1.4 &nbsp;Application Documents<\u002Fh3>\n  <p><strong>“Application Documents”<\u002Fstrong> means the separate Qualified Commercial application, credit authorization, bank-verification authorization, document-sharing authorization, privacy notice, electronic-signature consent, and related application materials used before funding. Application Documents are separate from this Agreement.<\u002Fp>\n\n  <h3>1.5 &nbsp;Business-Purpose Financing<\u002Fh3>\n  <p><strong>“Business-Purpose Financing”<\u002Fstrong> means financing whose proceeds are intended primarily for commercial, business, investment, inventory, real estate, equipment, refinancing, working-capital, or other non-personal purposes. It does not include consumer-purpose financing for an individual vehicle buyer.<\u002Fp>\n\n  <h3>1.6 &nbsp;Capital Health Services<\u002Fh3>\n  <p><strong>“Capital Health Services”<\u002Fstrong> means the ongoing business-purpose financial-readiness and capital-advisory services described in Section 10.<\u002Fp>\n\n  <h3>1.7 &nbsp;Closing Package<\u002Fh3>\n  <p><strong>“Closing Package”<\u002Fstrong> means, collectively, the Funding Documents; this Agreement; the completed Addendum A; the executed Funding Activation Certificate in Schedule 5; and the completed schedules delivered with them at closing. The completed Addendum A is the sole source of the operative production and remittance figures for the program.<\u002Fp>\n\n  <h3>1.8 &nbsp;Commitment Agreement<\u002Fh3>\n  <p><strong>“Commitment Agreement”<\u002Fstrong> means the Production Commitment and Capital Engagement Agreement previously executed by the Parties at the approval stage, which recorded the Dealer’s voluntary program election, its conditional production commitment, the Exclusivity Window, and the verified production baseline. As provided in Section 4.8 of the Commitment Agreement, this Agreement and the balance of the Closing Package supersede the Commitment Agreement as to the production, penetration, gross-production, remittance, reporting, monitoring, audit, default, remedy, pricing-adjustment, term, and termination terms of the program, and convert the Dealer’s conditional commitment into the operative obligations set out below. Where a figure or term appears in both, this Agreement controls.<\u002Fp>\n\n  <h3>1.9 &nbsp;Covered Products<\u002Fh3>\n  <p><strong>“Covered Products”<\u002Fstrong> means only the products specifically identified in Addendum A that the Sponsor is legally authorized and operationally able to provide, administer, or support in the applicable jurisdiction. Covered Products may include vehicle service contracts; GAP products; anti-theft products; appearance-protection products; key-replacement products; tire-and-wheel products; maintenance products; powertrain products; ancillary protection products; and other approved F&amp;I or aftermarket products.<\u002Fp>\n\n  <h3>1.10 &nbsp;Dealer Capital Relationship Manager<\u002Fh3>\n  <p><strong>“Dealer Capital Relationship Manager”<\u002Fstrong> or <strong>“Relationship Manager”<\u002Fstrong> means the authorized Qualified Commercial or Sponsor representative identified in Schedule 2. The Relationship Manager is not personally a lender, creditor, bank representative, fiduciary, guarantor, attorney, accountant, investment adviser, or consumer mortgage loan originator merely because the representative performs services contemplated by this Agreement.<\u002Fp>\n\n  <h3>1.11 &nbsp;Dealer Customer Information<\u002Fh3>\n  <p><strong>“Dealer Customer Information”<\u002Fstrong> means any nonpublic personal, financial, credit, transaction, financing, or identifying information concerning an individual vehicle buyer, applicant, lessee, guarantor, or customer.<\u002Fp>\n\n  <h3>1.12 &nbsp;Eligible Net Remittance<\u002Fh3>\n  <p><strong>“Eligible Net Remittance”<\u002Fstrong> means cash actually received in an approved remittance, lockbox, segregated, controlled, or collection account and legally available to be applied to the Funding Facility after deducting lawful cancellations and refunds; verified chargebacks; applicable taxes; required claims reserves; contractual policy obligations; approved administrative charges; and other deductions expressly permitted by the Funding Documents and Addendum A.<\u002Fp>\n\n  <h3>1.13 &nbsp;Funding Documents<\u002Fh3>\n  <p><strong>“Funding Documents”<\u002Fstrong> means the note, loan agreement, credit agreement, advance agreement, security agreement, guaranty, ACH authorization, account-control agreement, proceeds assignment, UCC documents, mortgage documents, commercial-financing disclosure, and other documents executed in connection with the Funding Facility.<\u002Fp>\n\n  <h3>1.14 &nbsp;Funding Facility<\u002Fh3>\n  <p><strong>“Funding Facility”<\u002Fstrong> means the business-purpose financing actually provided to the Dealer under the Funding Documents.<\u002Fp>\n\n  <h3>1.15 &nbsp;Funding Party<\u002Fh3>\n  <p><strong>“Funding Party”<\u002Fstrong> means the bank, fund, lender, special-purpose entity, or other lawful capital source identified in the Activation Certificate as the entity legally providing the Funding Facility. Qualified Commercial is the Funding Party only when expressly named as the lender or funding provider in the Funding Documents.<\u002Fp>\n\n  <h3>1.16 &nbsp;Minimum Activation Amount<\u002Fh3>\n  <div style=\"display:flex;align-items:flex-end;gap:12px;margin-top:5px\">\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350;flex:1\"><strong>“Minimum Activation Amount”<\u002Fstrong> means:<\u002Fdiv>\n    <div style=\"width:150px;flex:none\">\n      <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Amount<\u002Fdiv>\n      <div data-field=\"minimum_activation_amount\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p>No partial advance below the Minimum Activation Amount activates this Agreement unless all Parties sign a written amendment.<\u002Fp>\n\n  <h3>1.17 &nbsp;Program Support<\u002Fh3>\n  <p><strong>“Program Support”<\u002Fstrong> means the specific support identified in Schedule 1, which may include application and packaging support; capital-partner coordination; ongoing monitoring; reporting infrastructure; product-administration economics; first-risk support; a reserve contribution; controlled-account administration; preferential program economics; implementation services; Capital Health Services; or other documented support. No form of Program Support will be represented as having been provided unless it is accurately identified in Schedule 1.<\u002Fp>\n\n  <h3>1.18 &nbsp;Program Term<\u002Fh3>\n  <p><strong>“Program Term”<\u002Fstrong> means the period beginning on the Activation Date and ending in accordance with Section 14.<\u002Fp>\n\n  <h3>1.19 &nbsp;Protected Funding Source<\u002Fh3>\n  <p><strong>“Protected Funding Source”<\u002Fstrong> means only a Funding Party or capital source:<\u002Fp>\n  <ol>\n    <li>Identified by legal name in Schedule 4;<\u002Fli>\n    <li>Materially introduced to the Dealer through Qualified Commercial;<\u002Fli>\n    <li>Involved in the funded transaction or a documented financing process arising from it; and<\u002Fli>\n    <li>Not listed by the Dealer as a preexisting relationship in Schedule 4.<\u002Fli>\n  <\u002Fol>\n\n  <h3>1.20 &nbsp;Restricted Compensation<\u002Fh3>\n  <p><strong>“Restricted Compensation”<\u002Fstrong> means compensation to the Relationship Manager that is paid by the Funding Party; calculated as a percentage of the Funding Facility; calculated as points on the Funding Facility; based on the interest rate, default rate, lender spread, or finance charge; increased because the Dealer accepts more expensive financing; based on the amount of lender fees charged; a portion of bank interest or origination revenue; or otherwise structured as an undisclosed lender-paid referral or closing commission.<\u002Fp>\n\n  <h3>1.21 &nbsp;Sponsor Platform<\u002Fh3>\n  <p><strong>“Sponsor Platform”<\u002Fstrong> means the Sponsor-approved administration, submission, reporting, and remittance platform identified in Addendum A.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">2<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Activation and Effectiveness<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>2.1 &nbsp;This Agreement Is the Closing Instrument<\u002Fh3>\n  <p>This Agreement is executed at or after closing. It certifies that Actual Funding occurred, fixes the exact production and remittance thresholds, and converts the Dealer’s conditional commitment under the Commitment Agreement into operative obligations.<\u002Fp>\n\n  <h3>2.2 &nbsp;Conditions Satisfied<\u002Fh3>\n  <p>This Agreement takes effect on the Activation Date only after:<\u002Fp>\n  <ol>\n    <li>The Dealer and Funding Party executed the final Funding Documents;<\u002Fli>\n    <li>Actual Funding of at least the Minimum Activation Amount occurred;<\u002Fli>\n    <li>The Parties completed and signed the Funding Activation Certificate in Schedule 5;<\u002Fli>\n    <li>Addendum A was completed with exact production and remittance thresholds;<\u002Fli>\n    <li>Schedule 3 was completed and delivered to the Dealer;<\u002Fli>\n    <li>The Sponsor confirmed that it is authorized and operationally capable of administering the Covered Products;<\u002Fli>\n    <li>Any legally required state-specific commercial-financing disclosure was delivered; and<\u002Fli>\n    <li>Any required licenses, registrations, approvals, or exemptions were confirmed.<\u002Fli>\n  <\u002Fol>\n  <p style=\"margin-top:6px\">No funds should be released until the completed Activation Certificate is included in the closing package.<\u002Fp>\n\n  <h3>2.3 &nbsp;No Retroactive Production Obligation<\u002Fh3>\n  <p>Production occurring before the Production Commencement Date stated in the Activation Certificate will not be used to declare a default unless the Dealer intentionally diverted post-closing production during an agreed implementation period.<\u002Fp>\n\n  <h3>2.4 &nbsp;Staged Funding<\u002Fh3>\n  <p>If the Funding Facility is funded in stages:<\u002Fp>\n  <ol>\n    <li>The first disbursement must equal or exceed the Minimum Activation Amount;<\u002Fli>\n    <li>The Activation Certificate must identify the funded and unfunded portions;<\u002Fli>\n    <li>Production and remittance thresholds must be based on actual funded exposure unless otherwise expressly approved;<\u002Fli>\n    <li>Undrawn amounts do not create Dealer obligations beyond those tied to funded exposure; and<\u002Fli>\n    <li>Holdbacks and future advances remain subject to the Funding Documents.<\u002Fli>\n  <\u002Fol>\n\n  <h3>2.5 &nbsp;Thresholds Must Be Exact<\u002Fh3>\n  <p>No production, penetration, gross-production, remittance, or reporting threshold may be enforced against the Dealer unless the relevant verified baseline and the exact operative figure appear in a completed Addendum A. A blank field is not enforceable.<\u002Fp>\n\n  <h3>2.6 &nbsp;Relationship to the Commitment Agreement<\u002Fh3>\n  <p>The Exclusivity Window under the Commitment Agreement ended on the occurrence of Actual Funding. The Dealer’s pre-funding protections under that agreement are not revived by this Agreement, and the obligations in this Agreement apply prospectively from the Activation Date. This Agreement, together with the balance of the Closing Package, supersedes the Commitment Agreement to the extent stated in Section 1.8.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">3<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Separate Funding Documents and Party Roles<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>3.1 &nbsp;Qualified Commercial’s Capacity<\u002Fh3>\n  <p>Unless expressly stated otherwise in the Funding Documents, Qualified Commercial acts as program manager; business-purpose capital advisor; application and documentation coordinator; funding arranger; reporting coordinator; relationship-management platform; monitoring provider; and Sponsor-program coordinator. Qualified Commercial does not become the lender merely by receiving, compiling, analyzing, presenting, or transmitting financing information.<\u002Fp>\n\n  <h3>3.2 &nbsp;Funding Party’s Independent Decision<\u002Fh3>\n  <p>The Funding Party has exclusive authority over final credit approval; loan amount; interest rate; fees; amortization; term; collateral; guaranties; conditions precedent; adverse-action decisions; funding; servicing; default; acceleration; and enforcement of the Funding Documents. Neither the Sponsor nor the Relationship Manager may override a Funding Party decision.<\u002Fp>\n\n  <h3>3.3 &nbsp;No Oral Lending Commitment<\u002Fh3>\n  <p>No oral representation by Qualified Commercial, the Sponsor, or the Relationship Manager binds the Funding Party. Only a final written instrument issued or signed by the Funding Party may constitute a binding financing commitment.<\u002Fp>\n\n  <h3>3.4 &nbsp;Order of Precedence<\u002Fh3>\n  <p>In the event of a direct conflict:<\u002Fp>\n  <ol>\n    <li>The Funding Documents control principal, interest, payment, collateral, guaranty, default, and lender remedies;<\u002Fli>\n    <li>The Activation Certificate controls whether and when this Agreement activated;<\u002Fli>\n    <li>Addendum A controls production and remittance thresholds;<\u002Fli>\n    <li>Schedule 3 controls disclosed compensation; and<\u002Fli>\n    <li>This Agreement controls the continuing program, advisory, reporting, product, and relationship obligations.<\u002Fli>\n  <\u002Fol>\n  <p style=\"margin-top:6px\">No Funding Document may silently expand the Relationship Manager’s compensation.<\u002Fp>\n\n  <h3>3.5 &nbsp;Optional Funding Party Joinder<\u002Fh3>\n  <p>A Funding Party may become a Party or express third-party beneficiary only through a written joinder identifying the provisions it may enforce.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">4<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Funding Purpose and Use of Proceeds<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>4.1 &nbsp;Approved Purpose<\u002Fh3>\n  <p>The Funding Facility may be used only for the approved purposes stated in Schedule 1 and the Funding Documents. Approved purposes may include inventory acquisition; refinancing identified business debt; dealership working capital; equipment; real estate; renovation; F&amp;I program implementation; expansion; acquisition; approved operating liquidity; or other specifically approved business purposes.<\u002Fp>\n\n  <h3>4.2 &nbsp;Prohibited Uses<\u002Fh3>\n  <p>Unless expressly approved in writing, proceeds may not be used for personal, family, or household expenses; undisclosed owner distributions; unlawful activity; payment of an undisclosed intermediary fee; payments intended to influence a credit decision improperly; financing consumer vehicle purchases; transfers to undisclosed affiliates; speculative investments unrelated to the Dealer; fraudulent or misleading purposes; or a use prohibited by the Funding Documents.<\u002Fp>\n\n  <h3>4.3 &nbsp;Supporting Records<\u002Fh3>\n  <p>The Dealer will maintain invoices, payoff statements, purchase orders, settlement statements, bank records, and other reasonable evidence showing how proceeds were used.<\u002Fp>\n\n  <h3>4.4 &nbsp;No Responsibility for Dealer Misuse Without Knowledge<\u002Fh3>\n  <p>Qualified Commercial and the Sponsor may rely on the Dealer’s certified use-of-funds information unless they know or reasonably should know that it is materially inaccurate.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">5<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Covered Product Program<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>5.1 &nbsp;Commencement<\u002Fh3>\n  <p>The Dealer’s Covered Product obligations begin on the Production Commencement Date stated in the Activation Certificate. The Production Commencement Date should allow a reasonable implementation period following Actual Funding.<\u002Fp>\n\n  <h3>5.2 &nbsp;Exclusive Routing of Covered Products Sold<\u002Fh3>\n  <p>During the Program Term, the Dealer will route 100% of the Covered Products actually sold in Eligible Retail Transactions through the Sponsor Platform, except for an approved exclusion.<\u002Fp>\n\n  <h3>5.3 &nbsp;Eligible Retail Transaction<\u002Fh3>\n  <p>An <strong>“Eligible Retail Transaction”<\u002Fstrong> means a retail vehicle transaction that is completed and delivered; is recorded in the Dealer’s DMS; is eligible for the applicable Covered Product; occurs in a jurisdiction where the product may lawfully be offered; and is not otherwise excluded in Addendum A.<\u002Fp>\n  <p>Eligible Retail Transactions exclude wholesale transactions; dealer trades; unwinds; rescinded transactions; transactions in which the customer declines the product; transactions in which the product is legally unavailable; transactions rejected by the Sponsor for a legitimate documented reason; and other exclusions stated in Addendum A.<\u002Fp>\n\n  <h3>5.4 &nbsp;Compliant Offer Standard<\u002Fh3>\n  <p>The Dealer will cause its properly trained personnel to make Covered Products reasonably available for compliant presentation in eligible transactions. This provision does not require a customer to buy a product; misleading bundling; a hidden charge; a false representation that a product is mandatory; the falsification of a customer election; improper packing of payments; or conduct prohibited by law.<\u002Fp>\n\n  <h3>5.5 &nbsp;No Diversion<\u002Fh3>\n  <p>Without prior written approval, the Dealer may not:<\u002Fp>\n  <ol>\n    <li>Route a Covered Product to another provider;<\u002Fli>\n    <li>Replace the Sponsor;<\u002Fli>\n    <li>Divert Covered Product proceeds;<\u002Fli>\n    <li>Redirect remittances;<\u002Fli>\n    <li>Move production to an affiliate to avoid this Agreement;<\u002Fli>\n    <li>Conceal Covered Product production;<\u002Fli>\n    <li>Reclassify a Covered Product to avoid reporting;<\u002Fli>\n    <li>Establish a substantially similar avoidance arrangement; or<\u002Fli>\n    <li>Interfere with an approved controlled account or proceeds assignment.<\u002Fli>\n  <\u002Fol>\n\n  <h3>5.6 &nbsp;Products Not Available Through Sponsor<\u002Fh3>\n  <p>A product is not subject to exclusivity when the Sponsor is not legally authorized to provide it; the Sponsor does not offer it; the Sponsor cannot timely process it; the Sponsor rejects an otherwise eligible contract without reasonable grounds; a regulator prohibits the product; or the Parties approve an exception in writing.<\u002Fp>\n\n  <h3>5.7 &nbsp;Exact Production Thresholds<\u002Fh3>\n  <p>The Dealer must satisfy the exact production, penetration, routing, gross-production, remittance, and reporting requirements in Addendum A. No production threshold may be enforced unless the relevant baseline and exact operative number appear in the completed Addendum A.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">6<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Sponsor Obligations<\u002Fspan>\n  <\u002Fh2>\n\n  <p>The Sponsor will:<\u002Fp>\n  <ol>\n    <li>Maintain all required licenses, registrations, appointments, financial assurance, insurance, and authority;<\u002Fli>\n    <li>Use forms and disclosures appropriate for the applicable jurisdiction;<\u002Fli>\n    <li>Provide or arrange required customer contract documentation;<\u002Fli>\n    <li>Maintain legally required cancellation and refund procedures;<\u002Fli>\n    <li>Process eligible contracts consistently;<\u002Fli>\n    <li>Administer claims and reserves in accordance with applicable obligations;<\u002Fli>\n    <li>Provide Dealer training reasonably necessary for compliant product presentation;<\u002Fli>\n    <li>Maintain reasonable platform availability;<\u002Fli>\n    <li>Provide production, cancellation, chargeback, claim, and remittance reporting;<\u002Fli>\n    <li>Reconcile reported production;<\u002Fli>\n    <li>Safeguard Dealer and customer information;<\u002Fli>\n    <li>Avoid knowingly causing a Dealer production default;<\u002Fli>\n    <li>Avoid representing that the Funding Party guarantees a product;<\u002Fli>\n    <li>Avoid instructing Dealer personnel to make misleading customer statements;<\u002Fli>\n    <li>Disclose material changes in product availability or administration;<\u002Fli>\n    <li>Notify Qualified Commercial and the Dealer promptly of a licensing or regulatory issue;<\u002Fli>\n    <li>Maintain records supporting Sponsor calculations; and<\u002Fli>\n    <li>Cooperate with reasonable Funding Party monitoring requirements.<\u002Fli>\n  <\u002Fol>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">7<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Dealer Operating Obligations<\u002Fspan>\n  <\u002Fh2>\n\n  <p>During the Program Term, the Dealer will:<\u002Fp>\n  <ol>\n    <li>Maintain an active dealer license;<\u002Fli>\n    <li>Operate in the ordinary course;<\u002Fli>\n    <li>Maintain required insurance;<\u002Fli>\n    <li>Maintain accurate books and records;<\u002Fli>\n    <li>Provide truthful production information;<\u002Fli>\n    <li>Maintain its primary operating account as disclosed;<\u002Fli>\n    <li>Notify Qualified Commercial of material changes in ownership or control;<\u002Fli>\n    <li>Notify Qualified Commercial of material litigation, tax liens, judgments, bankruptcy, license issues, or regulatory action;<\u002Fli>\n    <li>Notify Qualified Commercial before incurring material undisclosed debt;<\u002Fli>\n    <li>Provide required bank, financial, debt, production, and remittance reporting;<\u002Fli>\n    <li>Maintain reasonable internal controls over F&amp;I production;<\u002Fli>\n    <li>Use properly trained personnel;<\u002Fli>\n    <li>Obtain customer signatures and elections lawfully;<\u002Fli>\n    <li>Refrain from falsifying product or financing documents;<\u002Fli>\n    <li>Refrain from concealing cancellations or chargebacks;<\u002Fli>\n    <li>Preserve required product and transaction records;<\u002Fli>\n    <li>Cooperate with legitimate audits;<\u002Fli>\n    <li>Use funding proceeds for approved business purposes; and<\u002Fli>\n    <li>Comply with applicable dealer, consumer, service-contract, privacy, fair-lending, and commercial-financing requirements.<\u002Fli>\n  <\u002Fol>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">8<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Remittance and Repayment Support<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>8.1 &nbsp;Approved Remittance Structure<\u002Fh3>\n  <p>The Dealer will follow the remittance, lockbox, controlled-account, proceeds-assignment, or ACH structure stated in the Funding Documents and Addendum A.<\u002Fp>\n\n  <h3>8.2 &nbsp;Minimum Coverage<\u002Fh3>\n  <p>Unless a higher amount is stated in Addendum A, monthly Eligible Net Remittance must equal or exceed the greater of:<\u002Fp>\n  <ol>\n    <li>The fixed minimum stated in Addendum A; or<\u002Fli>\n    <li>125% of the scheduled monthly principal, interest, recurring fees, and other scheduled debt service under the Funding Facility.<\u002Fli>\n  <\u002Fol>\n\n  <h3>8.3 &nbsp;ACH True-Up<\u002Fh3>\n  <p>If Eligible Net Remittance is insufficient to satisfy a scheduled payment, the Dealer must pay the shortage through ACH or another approved source within the cure period stated in Addendum A. An ACH true-up cures the payment shortage but does not automatically cure product diversion; falsified reporting; repeated production failure; unauthorized provider replacement; or interference with collateral or account control.<\u002Fp>\n\n  <h3>8.4 &nbsp;Protected Funds<\u002Fh3>\n  <p>Nothing in this Agreement authorizes the use of customer funds; required claims reserves; statutory trust funds; restricted insurance funds; funds belonging to another entity; or other legally restricted funds, in a manner inconsistent with law or contractual obligations.<\u002Fp>\n\n  <h3>8.5 &nbsp;Excess Remittance<\u002Fh3>\n  <p>Excess Eligible Net Remittance will be handled as stated in the Funding Documents and may be applied to scheduled repayment; principal reduction; reserve buildup; reconciliation; approved release to the Dealer; or another expressly agreed purpose.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">9<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Reporting, Monitoring, and Audit<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>9.1 &nbsp;Monthly Reporting<\u002Fh3>\n  <p>No later than the fifth business day of each month, the Dealer and Sponsor will provide, as applicable: retail units sold; Eligible Retail Transactions; VSC contracts sold; VSC penetration; Covered Product production by category; gross Covered Product production; eligible and ineligible contracts; cancellations; chargebacks; claims information; reserve information; product remittance statements; controlled-account activity; scheduled payments; ACH true-ups; Dealer bank statements; floorplan statements; inventory reports; debt changes; policy-routing exceptions; and other agreed monitoring information.<\u002Fp>\n\n  <h3>9.2 &nbsp;Weekly Reporting<\u002Fh3>\n  <p>Weekly production or exception reporting may be required when stated in Addendum A or reasonably required after a covenant deficiency.<\u002Fp>\n\n  <h3>9.3 &nbsp;System Access<\u002Fh3>\n  <p>The Dealer may authorize read-only API, bank, DMS, accounting, or Sponsor Platform access for legitimate monitoring purposes. Access must be limited to the minimum information reasonably necessary.<\u002Fp>\n\n  <h3>9.4 &nbsp;Audit Rights<\u002Fh3>\n  <p>Upon reasonable notice, Qualified Commercial, the Sponsor, the Funding Party, or their authorized auditor may review records reasonably related to funding proceeds; Covered Product production; remittances; cancellations; chargebacks; account control; covenant compliance; and report accuracy. Immediate review may be requested when there is a reasonable documented suspicion of fraud, diversion, or material falsification.<\u002Fp>\n\n  <h3>9.5 &nbsp;Audit Costs<\u002Fh3>\n  <p>Ordinary monitoring costs will be allocated as disclosed. The Dealer may be required to reimburse reasonable audit costs if an audit identifies a material intentional misstatement; undisclosed diversion; fraud; or a reporting discrepancy exceeding the threshold below that materially affected compliance.<\u002Fp>\n  <div style=\"display:flex;align-items:flex-end;gap:14px;margin-top:7px\">\n    <div style=\"width:150px;flex:none\">\n      <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Discrepancy threshold<\u002Fdiv>\n      <div data-field=\"audit_discrepancy_threshold\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:7.5px;color:#8FA3BF;padding-bottom:2px\">Suggested: 5%<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>9.6 &nbsp;Record Retention<\u002Fh3>\n  <p>Each Party will retain applicable records for the longer of five years after termination; the period required by applicable law; the period required by the Funding Documents; or the period reasonably necessary to resolve an existing dispute, audit, claim, or investigation.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">10<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Continuing Capital Health Services<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>10.1 &nbsp;Purpose<\u002Fh3>\n  <p>After activation, Qualified Commercial and the Relationship Manager will work with the Dealer to help maintain a financially healthy, lender-ready business and identify responsible business-purpose capital options.<\u002Fp>\n\n  <h3>10.2 &nbsp;Included Services<\u002Fh3>\n  <p>Subject to available information, the Capital Health Services may include:<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-top:5px\">\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">1.&nbsp; Reviewing the Dealer’s debt schedule;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">10.&nbsp; Reviewing whether refinancing may improve cash flow;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">2.&nbsp; Monitoring scheduled business debt service;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">11.&nbsp; Identifying potentially appropriate SBA, real-estate-backed, equipment, floorplan, inventory, working-capital, or other business-purpose programs;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">3.&nbsp; Reviewing DSCR;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">12.&nbsp; Comparing documented financing structures;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">4.&nbsp; Reviewing EBITDA, operating income, or other applicable profitability measures;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">13.&nbsp; Coordinating communications with qualified capital sources;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">5.&nbsp; Reviewing average daily bank balances;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">14.&nbsp; Preparing the Dealer for renewals or future facilities;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">6.&nbsp; Reviewing liquidity and returned-payment trends;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">15.&nbsp; Helping the Dealer identify unsustainable or unusually expensive debt;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">7.&nbsp; Identifying upcoming debt maturities;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">16.&nbsp; Reviewing production and remittance performance;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">8.&nbsp; Monitoring financial and reporting covenants;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">17.&nbsp; Maintaining a financing and covenant calendar; and<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">9.&nbsp; Helping organize lender-ready financial packages;<\u002Fdiv>\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350\">18.&nbsp; Escalating deteriorating financial trends for management attention.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>10.3 &nbsp;Service Cadence<\u002Fh3>\n  <p>Unless Schedule 2 states otherwise, a monthly account review will address production, remittance, reporting, and immediate covenant matters; a quarterly capital-health review will address DSCR, debt, liquidity, profitability, upcoming capital needs, and lender readiness; and an annual strategic review will address longer-term capital structure and refinancing opportunities.<\u002Fp>\n\n  <h3>10.4 &nbsp;Business Financing Only<\u002Fh3>\n  <p>Capital Health Services concern financing for the Dealer’s business. They do not include selecting consumer financing for vehicle buyers; setting consumer dealer markup; making consumer credit decisions; providing legal advice; providing tax advice; performing an audit; issuing reviewed or compiled financial statements; acting as a registered investment adviser; or assuming a fiduciary duty.<\u002Fp>\n\n  <h3>10.5 &nbsp;Dealer Responsibility<\u002Fh3>\n  <p>The Dealer remains responsible for its business decisions; selecting financing; reviewing final terms; obtaining legal and tax advice; maintaining accurate books; complying with loan covenants; and determining whether a proposed financing is appropriate.<\u002Fp>\n\n  <h3>10.6 &nbsp;No Guarantee<\u002Fh3>\n  <p>Neither Qualified Commercial, the Sponsor, nor the Relationship Manager guarantees that financing will remain available; a refinancing will occur; a lender will offer a particular rate; a recommendation will improve profitability; a financial projection will be achieved; or the Dealer will remain in compliance with every covenant.<\u002Fp>\n\n  <h3>10.7 &nbsp;Preferred Capital Advisor and Right of First Review<\u002Fh3>\n  <p>During the Program Term, Qualified Commercial will serve as the Dealer’s preferred business-purpose capital advisor.<\u002Fp>\n  <div style=\"display:flex;align-items:flex-end;gap:14px;margin-top:7px;border:0.5px solid #B9C6D8;padding:10px 12px\">\n    <div style=\"font-size:9.5px;line-height:1.5;color:#1F3350;flex:1\">Before accepting a new business-purpose financing obligation exceeding the threshold at right, the Dealer will provide Qualified Commercial a reasonable opportunity to review the proposed obligation.<\u002Fdiv>\n    <div style=\"width:150px;flex:none\">\n      <div style=\"font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391\">Review threshold<\u002Fdiv>\n      <div data-field=\"review_threshold\" style=\"min-height:16px;border-bottom:1px solid #0B1D3A;margin-top:3px\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin-top:6px\">Qualified Commercial will have no more than five business days after receiving reasonably complete information to identify a potentially healthier alternative; advise that it has no alternative; request additional information; or decline the review. The Dealer is not required to accept an option proposed by Qualified Commercial.<\u002Fp>\n  <p>This right does not apply to ordinary trade credit; routine inventory purchases; existing disclosed floorplan arrangements; emergency financing needed to prevent immediate material harm; financing below the stated threshold; consumer financing for vehicle buyers; or an excluded relationship listed in Schedule 4.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">11<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Production Deficiencies, Defaults, and Remedies<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>11.1 &nbsp;Production Deficiency<\u002Fh3>\n  <p>A <strong>“Production Deficiency”<\u002Fstrong> occurs when the Dealer fails an ordinary monthly production, penetration, reporting, or remittance test but the failure has not yet become a Program Default.<\u002Fp>\n\n  <h3>11.2 &nbsp;Deficiency Notice<\u002Fh3>\n  <p>Following a Production Deficiency:<\u002Fp>\n  <ol>\n    <li>Qualified Commercial or the Sponsor will provide written notice;<\u002Fli>\n    <li>The Dealer will provide a corrective-action plan within five business days;<\u002Fli>\n    <li>A payment shortage must be cured within the period stated in Addendum A;<\u002Fli>\n    <li>Additional monitoring may be imposed;<\u002Fli>\n    <li>Undrawn advances or holdbacks may be suspended by the party legally controlling them; and<\u002Fli>\n    <li>The Parties will conduct a production and capital-health review.<\u002Fli>\n  <\u002Fol>\n\n  <h3>11.3 &nbsp;Repeated Production Default<\u002Fh3>\n  <p>Unless Addendum A states a different objective test, an ordinary production deficiency becomes a <strong>“Program Default”<\u002Fstrong> when the same material monthly covenant is missed for two consecutive months; a material monthly covenant is missed in three months of a rolling six-month period; a rolling three-month covenant is missed; a remittance shortage remains uncured; or the Dealer fails to implement an agreed corrective-action plan.<\u002Fp>\n\n  <h3>11.4 &nbsp;Immediate Program Default<\u002Fh3>\n  <p>The following may constitute an immediate Program Default without an ordinary production cure period:<\u002Fp>\n  <ol>\n    <li>Intentional product diversion;<\u002Fli>\n    <li>Intentional remittance diversion;<\u002Fli>\n    <li>Fraud;<\u002Fli>\n    <li>Material falsification of production or financial reporting;<\u002Fli>\n    <li>Unauthorized replacement of the Sponsor;<\u002Fli>\n    <li>Misappropriation of controlled funds;<\u002Fli>\n    <li>Intentional interference with account control;<\u002Fli>\n    <li>Forgery or unauthorized signature;<\u002Fli>\n    <li>Material misuse of funding proceeds;<\u002Fli>\n    <li>Concealment of a material ownership change;<\u002Fli>\n    <li>Intentional obstruction of a legitimate audit;<\u002Fli>\n    <li>Loss of the Dealer’s license causing operations to cease; or<\u002Fli>\n    <li>Another immediate default expressly identified in the Funding Documents.<\u002Fli>\n  <\u002Fol>\n\n  <h3>11.5 &nbsp;Sponsor-Caused Shortfall<\u002Fh3>\n  <p>The Dealer will not be deemed in default to the extent a shortfall was directly caused by Sponsor platform failure; Sponsor refusal to process otherwise eligible contracts; Sponsor loss of authority; Sponsor failure to provide an agreed product; Sponsor reporting error; Sponsor material breach; a government prohibition affecting the product; or another event outside the Dealer’s reasonable control that the Dealer could not reasonably mitigate.<\u002Fp>\n\n  <h3>11.6 &nbsp;Force Majeure and Market Conditions<\u002Fh3>\n  <p>Temporary production deterioration caused by a documented disaster, government closure, material manufacturer interruption, regional market disruption, or comparable event will be addressed through a good-faith corrective plan rather than automatic acceleration, unless the Dealer is also in uncured payment default.<\u002Fp>\n\n  <h3>11.7 &nbsp;Available Remedies<\u002Fh3>\n  <p>Subject to applicable law and the Funding Documents, remedies may include additional reporting; a corrective-action plan; suspension of undrawn availability; suspension of holdback releases; increased reserves; cash trapping; ACH true-up; additional collateral requests; replacement of deficient account-control arrangements; termination of preferential program economics; a specifically disclosed prospective pricing adjustment; enforcement of proceeds assignments; termination of this Agreement; and Funding Party remedies under the Funding Documents.<\u002Fp>\n\n  <h3>11.8 &nbsp;Rate Adjustments<\u002Fh3>\n  <p>No rate increase may be imposed merely by referring to a “standard” or “non-subsidized” rate. Any pricing adjustment must be:<\u002Fp>\n  <ol>\n    <li>Specifically stated in the Funding Documents or Activation Certificate;<\u002Fli>\n    <li>Expressed as an exact rate or number of basis points;<\u002Fli>\n    <li>Prospective;<\u002Fli>\n    <li>Triggered by an objective event;<\u002Fli>\n    <li>Subject to applicable cure rights;<\u002Fli>\n    <li>Lawful; and<\u002Fli>\n    <li>Imposed only by a party authorized under the Funding Documents.<\u002Fli>\n  <\u002Fol>\n  <p style=\"margin-top:6px\">If the applicable field in the Activation Certificate is blank, no program-related rate adjustment applies.<\u002Fp>\n\n  <h3>11.9 &nbsp;Acceleration<\u002Fh3>\n  <p>Qualified Commercial or the Sponsor may not accelerate the Funding Facility unless it is the Funding Party or has express written enforcement authority. Acceleration is governed by the Funding Documents.<\u002Fp>\n\n  <h3>11.10 &nbsp;No Undisclosed Penalty<\u002Fh3>\n  <p>No Party may impose an undisclosed penalty, speculative lost-profit charge, or punitive fee for a production deficiency.<\u002Fp>\n\n  <h3>11.11 &nbsp;Restoration<\u002Fh3>\n  <p>After an ordinary Program Default is cured and the Dealer satisfies the applicable requirements for three consecutive months, suspended program benefits may be restored prospectively as agreed by the authorized Parties.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">12<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Sponsor or Program Manager Default<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>12.1 &nbsp;Sponsor Default<\u002Fh3>\n  <p>A Sponsor default may occur if the Sponsor loses required authority; materially fails to administer Covered Products; materially fails to remit required funds; repeatedly rejects eligible contracts without justification; commits fraud; materially breaches data-security duties; provides materially false reports; or otherwise materially breaches this Agreement.<\u002Fp>\n\n  <h3>12.2 &nbsp;Program Manager Default<\u002Fh3>\n  <p>A Program Manager default may occur if Qualified Commercial knowingly makes unauthorized lending promises; materially misuses Dealer information; conceals material compensation; materially breaches the Capital Health Services obligations; commits fraud; or otherwise materially breaches this Agreement.<\u002Fp>\n\n  <h3>12.3 &nbsp;Cure<\u002Fh3>\n  <p>Except for fraud, intentional misuse of funds, or a material security incident requiring immediate action, the defaulting Party will have ten business days after notice to begin a cure and thirty days to complete it when cure reasonably requires additional time.<\u002Fp>\n\n  <h3>12.4 &nbsp;Alternative Product Provider<\u002Fh3>\n  <p>If the Sponsor cannot lawfully or operationally continue, the Dealer may use an alternate provider approved by Qualified Commercial and, where required, the Funding Party. The Dealer will not be treated as diverting production while an approved replacement is being implemented.<\u002Fp>\n\n  <h3>12.5 &nbsp;Funding Obligations Continue<\u002Fh3>\n  <p>A Sponsor or Program Manager default does not eliminate the Dealer’s payment obligations to the Funding Party.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">13<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Protected Relationships and Non-Circumvention<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>13.1 &nbsp;Activation Required<\u002Fh3>\n  <p>This Section 13 does not apply unless Actual Funding occurred.<\u002Fp>\n\n  <h3>13.2 &nbsp;Protected Transactions<\u002Fh3>\n  <p>During the Program Term and for twelve months after it ends, the Dealer will not knowingly bypass Qualified Commercial in connection with a renewal of the funded facility; an increase with the same Protected Funding Source; a refinance by the same Protected Funding Source; a substantially related facility arising from Qualified Commercial’s funded introduction; or a transaction intentionally restructured to avoid Qualified Commercial’s disclosed rights.<\u002Fp>\n\n  <h3>13.3 &nbsp;Limitations<\u002Fh3>\n  <p>This Section does not apply to a preexisting relationship disclosed in Schedule 4; a publicly available lender relationship not introduced through Qualified Commercial; a lender that independently contacted the Dealer without use of Qualified Commercial confidential information; consumer auto financing; ordinary floorplan credit disclosed in Schedule 4; financing unrelated to the funded program; a source Qualified Commercial declined or failed to pursue within a reasonable period; or financing closed after Qualified Commercial provided written consent.<\u002Fp>\n\n  <h3>13.4 &nbsp;No Ownership of Dealer Relationships<\u002Fh3>\n  <p>Qualified Commercial does not own the Dealer, the Dealer’s customers, or all of the Dealer’s financing relationships. This Section protects only specifically identified funded or materially introduced relationships.<\u002Fp>\n\n  <h3>13.5 &nbsp;Remedies<\u002Fh3>\n  <p>A proven intentional violation may entitle Qualified Commercial to actual direct damages; unpaid disclosed compensation directly attributable to the bypassed transaction; reasonable equitable relief; and reasonable enforcement costs awarded by a court. Speculative future production, punitive damages, and undisclosed liquidated damages are not automatically recoverable under this Section.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">14<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Term and Termination<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>14.1 &nbsp;Program Term<\u002Fh3>\n  <p>The Program Term begins on the Activation Date. Unless terminated earlier for cause, it continues until the later of:<\u002Fp>\n  <ol>\n    <li>Payment in full of the Funding Facility; or<\u002Fli>\n    <li>Satisfaction of all outstanding reporting, reconciliation, and remittance obligations relating to the Funding Facility.<\u002Fli>\n  <\u002Fol>\n\n  <h3>14.2 &nbsp;Early Payoff<\u002Fh3>\n  <p>If the Dealer lawfully pays the Funding Facility in full: product-production obligations end on the payoff date; no future production obligation survives solely because the original maturity date has not arrived; any lawful prepayment obligation is governed by the Funding Documents; accrued obligations remain due; and Sections expressly stated to survive remain effective.<\u002Fp>\n\n  <h3>14.3 &nbsp;No Automatic Post-Payoff Advisory Renewal<\u002Fh3>\n  <p>Capital Health Services may continue after payoff only under a written renewal or separate advisory agreement.<\u002Fp>\n\n  <h3>14.4 &nbsp;Termination for Cause<\u002Fh3>\n  <p>A non-defaulting Party may terminate this Agreement following an uncured material breach, subject to the Funding Documents and the rights of the Funding Party.<\u002Fp>\n\n  <h3>14.5 &nbsp;Regulatory Termination<\u002Fh3>\n  <p>A Party may suspend or terminate an activity immediately when reasonably necessary to comply with law; avoid unlicensed conduct; respond to a regulator; address a security threat; protect restricted funds; or prevent ongoing consumer harm.<\u002Fp>\n\n  <h3>14.6 &nbsp;Effect of Termination<\u002Fh3>\n  <p>Termination does not cancel the Funding Documents; eliminate accrued payment obligations; authorize diversion of funds already assigned; excuse prior reporting failures; waive a prior breach; or eliminate rights that expressly survive.<\u002Fp>\n\n  <h3>14.7 &nbsp;Survival<\u002Fh3>\n  <p>The following survive as applicable: confidentiality; data security; record retention; accrued payment and reconciliation obligations; indemnification; dispute resolution; electronic-record provisions; protected relationship provisions for their stated period; and provisions necessary to interpret or enforce surviving obligations.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">15<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Privacy, Information Security, and Customer Data<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>15.1 &nbsp;Limited Purpose<\u002Fh3>\n  <p>Dealer Customer Information may be accessed, used, or disclosed only for an authorized financing transaction; Covered Product administration; transaction processing; servicing; claims; compliance; fraud prevention; required reporting; or another lawful and disclosed purpose.<\u002Fp>\n\n  <h3>15.2 &nbsp;Relationship Manager Access<\u002Fh3>\n  <p>The Relationship Manager should receive business-level status and performance information. The Relationship Manager will not receive raw Social Security numbers, raw credit scores, complete consumer reports, or unnecessary customer financial information.<\u002Fp>\n\n  <h3>15.3 &nbsp;Security Controls<\u002Fh3>\n  <p>Each Party receiving protected information will maintain safeguards reasonably appropriate to the information, including as applicable role-based access; least-privilege access; multi-factor authentication; encryption in transit and at rest; secure document transmission; logging; device security; credential management; secure disposal; incident-response procedures; vendor oversight; and workforce training.<\u002Fp>\n\n  <h3>15.4 &nbsp;Service-Provider Obligations<\u002Fh3>\n  <p>To the extent Qualified Commercial or the Sponsor acts as a service provider with access to customer information, it will:<\u002Fp>\n  <ol>\n    <li>Use the information only to provide authorized services;<\u002Fli>\n    <li>Maintain appropriate safeguards;<\u002Fli>\n    <li>Limit subcontractor access;<\u002Fli>\n    <li>Contractually require appropriate subcontractor protections;<\u002Fli>\n    <li>Cooperate with reasonable security assessments;<\u002Fli>\n    <li>Notify the Dealer of a material security incident;<\u002Fli>\n    <li>Assist with legally required response and notification; and<\u002Fli>\n    <li>Return or securely dispose of information when no longer required.<\u002Fli>\n  <\u002Fol>\n\n  <h3>15.5 &nbsp;Security Incident Notice<\u002Fh3>\n  <p>A Party discovering unauthorized access to protected information will notify affected Parties without unreasonable delay and, contractually, within 24 hours after confirming a material incident, unless prohibited by law or law enforcement. The notice will provide available information concerning the nature of the incident; information affected; systems involved; containment; remediation; required notices; and ongoing risk.<\u002Fp>\n\n  <h3>15.6 &nbsp;No Unauthorized Marketing<\u002Fh3>\n  <p>Dealer Customer Information may not be used for unrelated marketing, lead generation, data resale, or independent solicitation without a lawful basis and required notices or consents.<\u002Fp>\n\n  <h3>15.7 &nbsp;Separate Data Addendum<\u002Fh3>\n  <p>The Parties will execute a separate information-security or data-processing addendum when required by the Funding Party, Sponsor Platform, applicable law, or the nature of system access.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">16<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Fair Lending, Credit Reporting, and Customer Finance Boundaries<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>16.1 &nbsp;Equal Treatment<\u002Fh3>\n  <p>No Party or Relationship Manager may discriminate in any aspect of a credit transaction on a prohibited basis.<\u002Fp>\n\n  <h3>16.2 &nbsp;Neutral Credit Communications<\u002Fh3>\n  <p>The Relationship Manager may communicate neutral program criteria and relay authorized lender communications but may not create discriminatory criteria; discourage an applicant on a prohibited basis; conceal a credit option for compensation reasons; falsify denial reasons; or direct an adverse-action decision.<\u002Fp>\n\n  <h3>16.3 &nbsp;Consumer Reports<\u002Fh3>\n  <p>A consumer report concerning an owner or guarantor may be obtained only with a lawful permissible purpose and the authorization or certification required by the applicable provider and law.<\u002Fp>\n\n  <h3>16.4 &nbsp;Creditor Notices<\u002Fh3>\n  <p>The Funding Party or other legally responsible creditor will provide required credit notices. Qualified Commercial may assist operationally but does not assume the Funding Party’s notice obligation unless expressly agreed and legally permitted.<\u002Fp>\n\n  <h3>16.5 &nbsp;Consumer Auto Financing Excluded<\u002Fh3>\n  <p>This Agreement does not authorize Qualified Commercial or the Relationship Manager to select financing for an individual vehicle buyer; submit a consumer auto application; negotiate consumer credit terms; determine consumer dealer markup; receive compensation from a consumer auto creditor; provide individual consumer credit counseling; or make an adverse-action decision concerning a vehicle buyer. Any such activity requires a separate written and legally approved scope.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">17<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Representations and Warranties<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>17.1 &nbsp;Mutual Authority<\u002Fh3>\n  <p>Each Party represents that it is duly organized and in good standing where required; it has authority to enter into this Agreement; its signer is authorized; execution does not knowingly violate another binding agreement; and it will comply with applicable law.<\u002Fp>\n\n  <h3>17.2 &nbsp;Dealer Representations<\u002Fh3>\n  <p>The Dealer represents that the Funding Facility is for business purposes; application information is materially accurate; ownership information is complete; documents are authentic; it has disclosed material debt and liens; it has authority to provide business records; it will not direct another person to falsify information; and it has not relied on an oral funding guarantee.<\u002Fp>\n\n  <h3>17.3 &nbsp;Sponsor Representations<\u002Fh3>\n  <p>The Sponsor represents that it has authority to perform its stated role; it will maintain required product authority; it will accurately disclose its role; it will not knowingly use noncompliant product forms; it will maintain required financial assurance; it will not knowingly instruct the Dealer to mislead customers; and its compensation will be disclosed as required.<\u002Fp>\n\n  <h3>17.4 &nbsp;Qualified Commercial Representations<\u002Fh3>\n  <p>Qualified Commercial represents that it will accurately describe its role; it will not knowingly represent itself as the Funding Party unless it is one; it will not authorize the Relationship Manager to make final credit decisions; it will maintain the application and relationship controls described in this Agreement; it will disclose compensation as required; and it will not knowingly submit falsified information.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">18<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Indemnification<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>18.1 &nbsp;Dealer Indemnity<\u002Fh3>\n  <p>The Dealer will indemnify Qualified Commercial and the Sponsor from third-party claims arising from the Dealer’s fraud; material misrepresentation; unauthorized signature; product diversion; misuse of proceeds; unlawful customer sales practice; privacy breach caused by the Dealer; failure to provide required customer disclosures; violation of law; or material breach of this Agreement.<\u002Fp>\n\n  <h3>18.2 &nbsp;Sponsor Indemnity<\u002Fh3>\n  <p>The Sponsor will indemnify the Dealer and Qualified Commercial from third-party claims arising from the Sponsor’s unauthorized product administration; defective or unlawful product documents supplied by the Sponsor; failure to maintain required authority; improper claims or reserve administration; failure to issue a required refund within its control; privacy or security breach caused by the Sponsor; materially inaccurate Sponsor reporting; fraud; or material breach of this Agreement.<\u002Fp>\n\n  <h3>18.3 &nbsp;Qualified Commercial Indemnity<\u002Fh3>\n  <p>Qualified Commercial will indemnify the Dealer and Sponsor from third-party claims arising from Qualified Commercial’s knowing unauthorized lending representation; undisclosed prohibited compensation; unauthorized use of Dealer information; privacy or security breach caused by Qualified Commercial; fraud; or material breach of this Agreement.<\u002Fp>\n\n  <h3>18.4 &nbsp;Procedure<\u002Fh3>\n  <p>The indemnified Party will provide prompt notice; permit the indemnifying Party to control the defense, subject to reasonable safeguards; cooperate reasonably; and not settle a claim imposing liability or admission on another Party without consent.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">19<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Limitation of Liability<\u002Fspan>\n  <\u002Fh2>\n\n  <p>Except for payment obligations, fraud, willful misconduct, data-security obligations, confidentiality, indemnification, unauthorized signatures, diversion, or intentional non-circumvention:<\u002Fp>\n  <ol>\n    <li>No Party will be liable for indirect, incidental, special, exemplary, or punitive damages; and<\u002Fli>\n    <li>No Party guarantees projected production, profitability, financing availability, lender performance, or market conditions.<\u002Fli>\n  <\u002Fol>\n  <p style=\"margin-top:6px\">Nothing in this Section limits a Funding Party’s remedies under the Funding Documents.<\u002Fp>\n\n  <h2 style=\"display:flex;align-items:center;gap:10px;border-top:1.5px solid #0B1D3A;border-bottom:1.5px solid #0B1D3A;padding:7px 0\">\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:#0F7A73;flex:none\">20<\u002Fspan>\n    <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:0.09em;text-transform:uppercase;color:#0B1D3A\">Dispute Resolution and Governing Law<\u002Fspan>\n  <\u002Fh2>\n\n  <h3>20.1 &nbsp;Executive Review<\u002Fh3>\n  <p>Before filing a non-emergency claim, the Parties will attempt in good faith to resolve the dispute through authorized executives for at least ten business days.<\u002Fp>\n\n  <h3>20.2 &nbsp;Mediation<\u002Fh3>\n  <p>If executive review fails, the Parties will attempt confidential mediation in New Jersey before commencing ordinary litigation, unless immediate equitable relief is reasonably necessary.<\u002Fp>\n\n  <h3>20.3 &nbsp;Governing Law<\u002Fh3>\n  <p>This Agreement is governed by New Jersey law, without regard to conflict-of-law principles, except where federal law or the mandatory law of another jurisdiction applies.<\u002Fp>\n\n  <h3>20.4 &nbsp;Venue<\u002Fh3>\n  <p>Subject to mandatory law and any Funding Document provision, exclusive venue will be in the state or federal courts located in New Jersey.<\u002Fp>\n\n  <h3>20.5 &nbsp;Equitable Relief<\u002Fh3>\n  <p>A Party may seek temporary or permanent equitable relief for data misuse; unauthorized disclosure; forgery; diversion; misappropriation of controlled funds; intentional circumvention; or another breach for which monetary damages would be inadequate.<\u002Fp>\n\n  <h3>20.6 &nbsp;Jury-Trial Waiver<\u002Fh3>\n  <div style=\"border:1px solid #0B1D3A;padding:9px 12px;margin-top:6px\">\n    <div style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:9.5px;line-height:1.5;color:#0B1D3A;text-transform:uppercase\">To the fullest extent permitted by law, each Party knowingly and voluntarily waives trial by jury in a dispute arising directly from this Agreement.<\u002Fdiv>\n    <p style=\"margin-top:6px\">Each Party should review this waiver with independent counsel.<\u002Fp>\n    <div style=\"display:flex;gap:22px;margin-top:10px\">\n      <div style=\"flex:1\"><div style=\"min-height:16px;border-bottom:1px solid #0B1D3A\"><\u002Fdiv><div style=\"font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:#5E7391;margin-top:3px\">QC
