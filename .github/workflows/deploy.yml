name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write       # OIDC into AWS
  contents: read
  packages: write       # push to GHCR

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/qcbackend
    steps:
      - uses: actions/checkout@v4

      # ---------- Build + push to GHCR ----------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      # ---------- Trigger rolling restart on EC2 via SSM ----------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SSM rolling restart
        run: |
          set -e
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --comment "Deploy qcbackend ${{ github.sha }}" \
            --parameters '{"commands":[
              "set -e",
              "docker pull '"${{ env.IMAGE }}:${{ github.sha }}"'",
              "docker tag '"${{ env.IMAGE }}:${{ github.sha }}"' qcbackend:current",
              "systemctl restart qcbackend || systemctl start qcbackend",
              "sleep 5",
              "systemctl is-active qcbackend"
            ]}' \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "  [$i] $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
            esac
            sleep 3
          done
          echo "Timed out waiting for SSM command"
          exit 1
