name: ci

# Runs on its own for pull requests, and as the first job of deploy.yml
# (workflow_call) for every push to main, so nothing ships until this passes.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - name: Ruff changed Python files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            # No "before" (workflow_dispatch, first push): lint against the parent.
            git fetch --no-tags --deepen=1 origin
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t PYTHON_FILES < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- '*.py'
          )
          if (( ${#PYTHON_FILES[@]} )); then
            uv run ruff check "${PYTHON_FILES[@]}"
          else
            echo "No changed Python files to lint."
          fi
