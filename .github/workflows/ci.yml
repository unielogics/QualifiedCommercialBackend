name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
