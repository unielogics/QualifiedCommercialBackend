services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qc-postgres
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc
      POSTGRES_DB: qc
    ports:
      - "5432:5432"
    volumes:
      - qc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d qc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qc_pgdata:
