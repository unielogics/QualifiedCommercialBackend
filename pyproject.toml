[project]
name = "qcbackend"
version = "0.1.0"
description = "Qualified Commercial — FastAPI backend for the AI-driven brokerage underwriting platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "anthropic>=0.40.0",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.20",
    "websockets>=14.0",
    "psycopg[binary]>=3.3.4",
    "beautifulsoup4>=4.12.0",
    # Pre-qualification letter PDF generator. Jinja2 was previously a
    # transitive dep via FastAPI; promoted to direct so we can use the
    # FileSystemLoader in app/services/prequal_pdf.py without surprise.
    "jinja2>=3.1.0",
    "weasyprint>=63.0",
    # In-process scheduler for recurring AI / calendar / digest work.
    # See app/services/scheduler.py — single-instance assumption only.
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "datamodel-code-generator>=0.26.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
